<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>mainstreet</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!--
    Engine chrome only. Nothing here names a world: the HUD text is filled in
    from the world pack at boot.
  -->
  <div id="wrap">
    <header id="hud">
      <h1 data-hud="title">&nbsp;</h1>
      <span data-hud="episode">&nbsp;</span>
    </header>

    <div id="stage">
      <!--
        The one DOM control drawn over the canvas. Empty and hidden until the
        engine has something to link to (today: the invitation to paint an
        unpainted building); its href and label come from the world pack, never
        from here. data-overlay tells the input layer to leave it alone so the
        browser can handle taps, Tab and Enter on a real link.
      -->
      <a id="say-link" class="overlay-link" data-overlay="link" hidden target="_blank" rel="noopener"></a>

      <!--
        A small pool of DOM anchors for the Credits screen's own link rows —
        About this game, Paint a building, Open source on GitHub (issue #65).
        Real links, so touch, Tab and Enter are the browser's job rather than
        the game's (data-overlay keeps engine/input.ts's own pointer path off
        them, same as #say-link above); hidden and repointed by
        engine/scenes/title.ts, one anchor per row that is actually on
        screen. A fixed pool rather than one shared anchor because, unlike
        #say-link, Credits can show more than one of these at once.
      -->
      <a class="overlay-link row-link credit-link" data-overlay="link" hidden target="_blank" rel="noopener"></a>
      <a class="overlay-link row-link credit-link" data-overlay="link" hidden target="_blank" rel="noopener"></a>
      <a class="overlay-link row-link credit-link" data-overlay="link" hidden target="_blank" rel="noopener"></a>
    </div>

    <div id="controls">
      <div id="dpad">
        <div class="db blank"></div>
        <div class="db" data-dpad="up" aria-label="up">&#9650;</div>
        <div class="db blank"></div>
        <div class="db" data-dpad="left" aria-label="left">&#9664;</div>
        <div class="db blank"></div>
        <div class="db" data-dpad="right" aria-label="right">&#9654;</div>
        <div class="db blank"></div>
        <div class="db" data-dpad="down" aria-label="down">&#9660;</div>
        <div class="db blank"></div>
      </div>
      <div id="btnA" data-action="a">A</div>
    </div>
  </div>

  <script type="module" src="/engine/main.ts"></script>
</body>
</html>
